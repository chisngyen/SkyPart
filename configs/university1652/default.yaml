# University-1652 clean recipe (paper headline: D->S R@1 96.47 / S->D R@1 98.43).
# Single-pass 448x448, 4-folder D2S/S2D protocol, no altitude metadata (mean-FiLM).
DATASET: "university1652"

DATA_ROOT: "./data/university1652"
OUTPUT_DIR: "./outputs"
NUM_ALTITUDES: 1     # No altitude metadata; FiLM bank degenerates to mean.
NUM_CLASSES: 701

IMG_SIZE: 448
N_PARTS: 12   # K_max (paper Tab. A1)
PART_DIM: 256
EMBED_DIM: 768
TEACHER_DIM: 768
CLUSTER_TEMP: 0.07
UNFREEZE_BLOCKS: 6

NUM_EPOCHS: 60
EVAL_INTERVAL: 5
EVAL_BATCH_SIZE: 64
EVAL_NUM_WORKERS: 2
P_CLASSES: 16        # paper Tab. A1: (P, M) = (16, 4), batch 64
K_SAMPLES: 4
LR: 3.0e-4
BACKBONE_LR: 3.0e-5
WEIGHT_DECAY: 0.05
WARMUP_EPOCHS: 5
USE_AMP: true
SEED: 42
NUM_WORKERS: 2

PATCH_NCE_WEIGHT: 0.3
PATCH_NCE_SAMPLES: 64

VICREG_WEIGHT: 0.5
VICREG_SIM_COEFF: 25.0
VICREG_STD_COEFF: 25.0
VICREG_COV_COEFF: 1.0

CIRCLE_MARGIN: 0.25
CIRCLE_GAMMA: 256

PROXY_MARGIN: 0.1
PROXY_ALPHA: 32
EMA_DECAY: 0.996
LABEL_SMOOTHING: 0.1
MASK_RATIO: 0.30
RECON_WARMUP: 10
DISTILL_TEMP: 4.0
NUM_LOSS_GROUPS: 4

GAT_HEADS: 4
GAT_HIDDEN: 128
GRAPH_EMBED_DIM: 256
GRAPH_LOSS_WEIGHT: 0.5
