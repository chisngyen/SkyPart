# SUES-200 weather fine-tune (paper Tab. 3: Normal R@1 97.21, Mean R@1 94.71).
# Fine-tunes the clean checkpoint: scripts/train.py --weather --init-ckpt <clean.pth>
# 60 epochs at 392x392 (28x28 patch grid for DINOv2 ViT-S/14).
# Online weather augmentation on drone images only; satellite stays clean (paper Sec. 4.4).
DATASET: "sues200"
SUES_ROOT: "./data/sues200"
OUTPUT_DIR: "./outputs"
ALTITUDES: ["150", "200", "250", "300"]
ALT_TO_IDX: {"150": 0, "200": 1, "250": 2, "300": 3}
NUM_ALTITUDES: 4
NUM_CLASSES: 120

IMG_SIZE: 392
N_PARTS: 12   # K_max (paper Tab. A1)
PART_DIM: 256
EMBED_DIM: 768
TEACHER_DIM: 768
CLUSTER_TEMP: 0.07
UNFREEZE_BLOCKS: 6

NUM_EPOCHS: 60
EVAL_INTERVAL: 5
EVAL_BATCH_SIZE: 64
EVAL_NUM_WORKERS: 2
P_CLASSES: 16        # paper Tab. A1: (P, M) = (16, 4), batch 64
K_SAMPLES: 4
LR: 1.0e-4
BACKBONE_LR: 1.0e-5
WEIGHT_DECAY: 0.05
WARMUP_EPOCHS: 5
USE_AMP: true
SEED: 42
NUM_WORKERS: 2

PATCH_NCE_WEIGHT: 0.3
PATCH_NCE_SAMPLES: 64
VICREG_WEIGHT: 0.5
VICREG_SIM_COEFF: 25.0
VICREG_STD_COEFF: 25.0
VICREG_COV_COEFF: 1.0
CIRCLE_MARGIN: 0.25
CIRCLE_GAMMA: 256
PROXY_MARGIN: 0.1
PROXY_ALPHA: 32
EMA_DECAY: 0.996
LABEL_SMOOTHING: 0.1
MASK_RATIO: 0.30
RECON_WARMUP: 10   # MAR warmup (paper Tab. A1)
DISTILL_TEMP: 4.0
NUM_LOSS_GROUPS: 4
GAT_HEADS: 4
GAT_HIDDEN: 128
GRAPH_EMBED_DIM: 256
GRAPH_LOSS_WEIGHT: 0.5
MINE_INTERVAL: 10
HARD_RATIO_START: 0.3
HARD_RATIO_END: 0.8
TOP_K_HARD: 10
