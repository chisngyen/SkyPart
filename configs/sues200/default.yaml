# SUES-200 clean recipe (paper headline: D->S Mean R@1 98.74).
# Single-pass 448x448, full 200-tile gallery, no re-ranking, no TTA.
DATASET: "sues200"

# Paths -- override on your machine.
SUES_ROOT: "./data/sues200"
DRONE_DIR: "drone-view"
SAT_DIR: "satellite-view"
OUTPUT_DIR: "./outputs"

# Protocol
ALTITUDES: ["150", "200", "250", "300"]
ALT_TO_IDX: {"150": 0, "200": 1, "250": 2, "300": 3}
ALT_HEIGHTS: [150, 200, 250, 300]
NUM_ALTITUDES: 4
NUM_CLASSES: 120

# Model
IMG_SIZE: 448
N_PARTS: 12   # K_max bank size (paper Tab. A1); typical active K = 10 via salience gate
GATE_SPARSITY: 0.1
PART_DIM: 256
EMBED_DIM: 768
TEACHER_DIM: 768
CLUSTER_TEMP: 0.07
UNFREEZE_BLOCKS: 6

# Patch NCE
PATCH_NCE_WEIGHT: 0.3
PATCH_NCE_SAMPLES: 64

# Training
NUM_EPOCHS: 60   # paper Tab. A1
EVAL_INTERVAL: 5
P_CLASSES: 16        # paper Tab. A1: (P, M) = (16, 4), batch 64
K_SAMPLES: 4
LR: 3.0e-4
BACKBONE_LR: 3.0e-5
WEIGHT_DECAY: 0.05
WARMUP_EPOCHS: 5
USE_AMP: true
SEED: 42
NUM_WORKERS: 2

# VICReg
VICREG_WEIGHT: 0.5
VICREG_SIM_COEFF: 25.0
VICREG_STD_COEFF: 25.0
VICREG_COV_COEFF: 1.0

# Circle
CIRCLE_MARGIN: 0.25
CIRCLE_GAMMA: 256

# GeoPartLoss
PROXY_MARGIN: 0.1
PROXY_ALPHA: 32
EMA_DECAY: 0.996
LABEL_SMOOTHING: 0.1
MASK_RATIO: 0.30
RECON_WARMUP: 10
DISTILL_TEMP: 4.0
NUM_LOSS_GROUPS: 4

# Graph
GAT_HEADS: 4
GAT_HIDDEN: 128
GRAPH_EMBED_DIM: 256
GRAPH_LOSS_WEIGHT: 0.5

# Hard negative mining
MINE_INTERVAL: 10
HARD_RATIO_START: 0.3
HARD_RATIO_END: 0.8
TOP_K_HARD: 10
