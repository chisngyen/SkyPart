# DenseUAV clean recipe (paper headline: R@1 91.85, mAP 92.52).
# Single-pass 448x448, official full gallery, mean-FiLM at inference. No re-ranking, no TTA.
# Dense_GPS_ALL.txt ships with the dataset; place it at DENSEUAV_ROOT for SDM@k.
DATASET: "denseuav"

DENSEUAV_ROOT: "./data/denseuav"
OUTPUT_DIR: "./outputs"
HEIGHTS: ["H80", "H90", "H100"]
DENSE_GPS_FILE: "Dense_GPS_ALL.txt"
ALT_TO_IDX: {"H80": 0, "H90": 1, "H100": 2}
NUM_ALTITUDES: 3
NUM_CLASSES: 2256

IMG_SIZE: 448
N_PARTS: 12          # K_max = 12 (paper bank capacity)
PART_DIM: 256
EMBED_DIM: 768
TEACHER_DIM: 768
CLUSTER_TEMP: 0.07
UNFREEZE_BLOCKS: 6

NUM_EPOCHS: 60
EVAL_INTERVAL: 5
EVAL_BATCH_SIZE: 64
EVAL_NUM_WORKERS: 2
P_CLASSES: 16        # paper Tab. A1: (P, M) = (16, 4), batch 64
K_SAMPLES: 4
LR: 3.0e-4
BACKBONE_LR: 3.0e-5
WEIGHT_DECAY: 0.05
WARMUP_EPOCHS: 5
USE_AMP: true
SEED: 42
NUM_WORKERS: 2

PATCH_NCE_WEIGHT: 0.3
PATCH_NCE_SAMPLES: 64

VICREG_WEIGHT: 0.5
VICREG_SIM_COEFF: 25.0
VICREG_STD_COEFF: 25.0
VICREG_COV_COEFF: 1.0

CIRCLE_MARGIN: 0.25
CIRCLE_GAMMA: 256

PROXY_MARGIN: 0.1
PROXY_ALPHA: 32
EMA_DECAY: 0.996
LABEL_SMOOTHING: 0.1
MASK_RATIO: 0.30
RECON_WARMUP: 10
DISTILL_TEMP: 4.0
NUM_LOSS_GROUPS: 4

GAT_HEADS: 4
GAT_HIDDEN: 128
GRAPH_EMBED_DIM: 256
GRAPH_LOSS_WEIGHT: 0.5

MINE_INTERVAL: 5
HARD_RATIO_START: 0.3
HARD_RATIO_END: 0.8
TOP_K_HARD: 10
